<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Birthday 9-Box Mystery Game</title>
  <script src="https://unpkg.com/css-doodle@0.34.10/css-doodle.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #270F34;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      position: relative;
      overflow-x: hidden;
    }
    h1 {
      color: #ff4081;
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      z-index: 2;
      position: relative;
      margin: 10px 0;
    }
    p {
      font-size: clamp(0.9rem, 2.5vw, 1.2rem);
      color: white;
      z-index: 2;
      position: relative;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
      width: 100%;
      max-width: 400px;
      z-index: 2;
      position: relative;
    }
    .box {
      aspect-ratio: 1 / 1;
      background: #ff80ab;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(14px, 4vw, 20px);
      font-weight: bold;
      border-radius: 10px;
      cursor: pointer;
      transition: transform 0.2s;
      user-select: none;
    }
    .box:hover {
      transform: scale(1.05);
    }
    .revealed {
      background: #fff;
      color: #333;
      cursor: default;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    /* Modal styling */
    .modal {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      visibility: hidden;
      padding: 10px;
      z-index: 10;
    }
    .modal-content {
      background: white;
      padding: 20px 30px;
      border-radius: 10px;
      text-align: center;
      max-width: 350px;
      width: 90%;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }
    .modal-content h2 {
      color: #ff4081;
      font-size: 1.5rem;
    }
    .modal-content p {
      font-size: 1rem;
    }
    .modal-content button {
      background: #ff80ab;
      border: none;
      padding: 10px 20px;
      margin-top: 15px;
      color: white;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
    }
    .modal.show {
      visibility: visible;
    }

    /* Mobile tweaks */
    @media (max-width: 500px) {
      .grid {
        gap: 10px;
        max-width: 300px;
      }
      .modal-content {
        padding: 15px 20px;
      }
      .modal-content h2 {
        font-size: 1.2rem;
      }
      .modal-content p {
        font-size: 0.9rem;
      }
    }

    css-doodle {
      position: fixed;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
  </style>

  <style>
    css-doodle {
      --color: @p(#51eaea, #fffde1, #ff9d76, #FB3569);
      --rule: (
        :doodle {
          @grid: 30x1 / 18vmin;
          --deg: @p(-180deg, 180deg);
        }
        :container {
          perspective: 30vmin;
        }
        :after, :before {
          content: '';
          background: var(--color); 
          @place-cell: @r(100%) @r(100%);
          @size: @r(6px);
          @shape: heart;
        }
        @place-cell: center;
        @size: 100%;
        box-shadow: @m2(0 0 50px var(--color));
        background: @m100(
          radial-gradient(var(--color) 50%, transparent 0) 
          @r(-20%, 120%) @r(-20%, 100%) / 1px 1px
          no-repeat
        );
        will-change: transform, opacity;
        animation: scale-up 12s linear infinite;
        animation-delay: calc(-12s / @I * @i);
        @keyframes scale-up {
          0%, 95.01%, 100% {
            transform: translateZ(0) rotate(0);
            opacity: 0;
          }
          10% { opacity: 1; }
          95% { transform: translateZ(35vmin) rotateZ(@var(--deg)); }
        }
      )
    }
  </style>
</head>
<body>
  <!-- Background hearts -->
  <css-doodle use="var(--rule)"></css-doodle>

  <h1>🎉 Birthday Mystery Prize Game 🎉</h1>
  <p>Click one box to reveal your reward!</p>
  <div class="grid" id="grid"></div>

  <!-- Birthday Greeting Modal -->
  <div class="modal" id="greetingModal">
    <div class="modal-content">
      <h2>🎂 Happy Birthday! 🎂</h2>
      <p>Click ONE box to reveal your special surprise!</p>
      <button onclick="closeGreeting()">Let's Play!</button>
    </div>
  </div>

  <!-- Warning Modal -->
  <div class="modal" id="warningModal">
    <div class="modal-content">
      <h2>⚠️ Only One Choice!</h2>
      <p>You can only choose 1 box!</p>
      <button onclick="closeWarning()">OK</button>
    </div>
  </div>

  <script>
    const prizes = [
      "1000 robux",
      "300 Gcash",
      "300 Dias",
      "Bokya",
      "Try Again",
      "Bokya",
      "mlc mansion",
      "Bokya",
      "Try Again"
    ];
    prizes.sort(() => Math.random() - 0.5);

    const grid = document.getElementById("grid");
    let boxOpened = false;

    for (let i = 0; i < 9; i++) {
      const box = document.createElement("div");
      box.classList.add("box");
      box.textContent = "❓";

      box.addEventListener("click", () => {
        if (!boxOpened) {
          box.classList.add("revealed");
          box.textContent = prizes[i];

          if (prizes[i] === "Try Again") {
            boxOpened = false; // let them try again
          } else {
            boxOpened = true; // lock after real prize
          }
        } else {
          document.getElementById("warningModal").classList.add("show");
        }
      });

      grid.appendChild(box);
    }

    function closeGreeting() {
      document.getElementById("greetingModal").classList.remove("show");
    }
    function closeWarning() {
      document.getElementById("warningModal").classList.remove("show");
    }
    window.onload = function() {
      document.getElementById("greetingModal").classList.add("show");
    };
  </script>
</body>
</html>
